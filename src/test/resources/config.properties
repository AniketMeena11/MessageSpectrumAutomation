# ============================================================
# Messenger Spectrum  Automation - Configuration File
# ============================================================

# Application URL
base.url=https://messagespectrum.com/Secret.aspx

# Browser (chrome / firefox / edge)
browser=chrome

# Run headless (true / false)
headless=false

# Implicit Wait (seconds)
implicit.wait=10

# Explicit Wait (seconds)
explicit.wait=15

# Page Load Timeout (seconds)
page.load.timeout=30

# Screenshots folder
screenshot.path=test-output/screenshots/


# Extent Report Path
report.path=test-output/ExtentReport.html
